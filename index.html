// ---------- picking ----------
const ray = new THREE.Raycaster(); ray.params.Line.threshold = 0; const info = document.getElementById('info');
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  const hit = ray.intersectObjects([cabinetry, island, shell, ceiling, props, dining, lighting, cableLights], true).find(h => h.object.isMesh && shown(h.object));
  info.textContent = hit?.object.userData.info ?? 'Walls existing. Floor: wide-plank character-grade white oak, natural finish - installed before cabinets.';
});

// ---------- loop ----------
// ambient occlusion for contact shadows in corners, under tops and around doors
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera); gtao.updateGtaoMaterial({ radius: 6, distanceExponent: 1.5, thickness: 4, scale: 1.2 }); composer.addPass(gtao);
composer.addPass(new OutputPass());
function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); composer.setSize(w, h); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px'; camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(wrap); resize();
camera.position.set(...VIEWS.Overview[0]); controls.target.set(...VIEWS.Overview[1]); go('Overview'); tween = null;
renderer.setAnimationLoop(() => {
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.s) / 900), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k === 1) tween = null;
  }
  frame();
});
function frame() {
  controls.update();
  for (const w of walls) w.g.visible = !(camera.position[w.axis] * w.sign > w.v * w.sign);
  ceil.visible = camera.position.y <= 101 && toggles.Ceiling.on;
  ceiling.visible = toggles.Beams.on && camera.position.y < 260;   // beams drop out in plan view
  if (photo) composer.render(); else renderer.render(scene, camera);
}
window.__viewer = { frame, controls, go, scene, camera, renderer, toggles, walls, ceil };
console.log('viewer ready', scene.children.length);
